name: omni-pixel

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: omni_pixel
      POSTGRES_USER: pixel
      POSTGRES_PASSWORD: 123456
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs *.sql in sorted order on first boot only (empty data volume).
      - ./packages/db/init:/docker-entrypoint-initdb.d

volumes:
  postgres-data: